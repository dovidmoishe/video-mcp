[package]
name = "video-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
# Kept from the former workspace so dependency resolution is unchanged.
resolver = "2"

[features]
default = ["native", "whisper"]
# Without `native`, media work returns explicit errors; schemas and pure contracts still test.
native = ["dep:ffmpeg-next", "dep:windows"]
whisper = ["native", "dep:whisper-rs"]

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
rmcp = { version = "=0.8.5", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "io-std", "process", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
ffmpeg-next = { version = "=8.0.0", optional = true, default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
whisper-rs = { version = "=0.16.0", optional = true, features = ["tracing_backend"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

[profile.release]
lto = "thin"
codegen-units = 1
